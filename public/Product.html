<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Store - Stripe Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        color: white;
        margin-bottom: 30px;
        font-size: 2.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 25px;
        margin-bottom: 30px;
      }

      .product-card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        overflow: hidden;
      }

      .product-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .product-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 15px;
      }

      .product-name {
        font-size: 1.4rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 10px;
      }

      .product-description {
        color: #666;
        margin-bottom: 15px;
        line-height: 1.6;
      }

      .product-price {
        font-size: 1.5rem;
        font-weight: bold;
        color: #4caf50;
        margin-bottom: 15px;
      }

      .product-stock {
        color: #888;
        margin-bottom: 15px;
        font-size: 0.9rem;
      }

      .quantity-selector {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
      }

      .quantity-selector label {
        margin-right: 10px;
        font-weight: bold;
      }

      .quantity-selector input {
        width: 60px;
        padding: 5px;
        border: 1px solid #ddd;
        border-radius: 5px;
        text-align: center;
      }

      .pay-button {
        width: 100%;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .pay-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .pay-button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      /* Payment Modal */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        background-color: white;
        margin: 5% auto;
        padding: 30px;
        border-radius: 15px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: modalSlideIn 0.3s ease;
      }

      @keyframes modalSlideIn {
        from {
          opacity: 0;
          transform: translateY(-50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
      }

      .close:hover {
        color: #000;
      }

      .payment-form {
        margin-top: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #333;
      }

      .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 1rem;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
      }

      #card-element {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: white;
      }

      #card-errors {
        color: #e74c3c;
        margin-top: 10px;
        font-size: 0.9rem;
      }

      .payment-button {
        width: 100%;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 20px;
      }

      .payment-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .payment-button:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }

      .loading {
        display: none;
        text-align: center;
        margin: 20px 0;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .success-message,
      .error-message {
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        display: none;
      }

      .success-message {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .error-message {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .order-summary {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .order-summary h3 {
        margin-bottom: 10px;
        color: #333;
      }

      .order-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 5px;
      }

      .order-total {
        font-weight: bold;
        border-top: 1px solid #ddd;
        padding-top: 10px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🛍️ Product Store</h1>
      <div id="products-grid" class="products-grid">
        <!-- Products will be loaded here -->
      </div>
    </div>

    <!-- Payment Modal -->
    <div id="paymentModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Complete Your Purchase</h2>

        <div class="order-summary">
          <h3>Order Summary</h3>
          <div class="order-item">
            <span id="orderProductName"></span>
            <span id="orderProductPrice"></span>
          </div>
          <div class="order-item">
            <span>Quantity: <span id="orderQuantity"></span></span>
            <span></span>
          </div>
          <div class="order-item order-total">
            <span>Total:</span>
            <span id="orderTotal"></span>
          </div>
        </div>

        <form id="payment-form" class="payment-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required />
          </div>

          <div class="form-group">
            <label for="card-element">Card Details</label>
            <div id="card-element"></div>
            <div id="card-errors" role="alert"></div>
          </div>

          <div class="loading">
            <div class="spinner"></div>
            <p>Processing payment...</p>
          </div>

          <div class="success-message">
            <strong>Payment Successful!</strong>
            <p>
              Thank you for your purchase. You will receive a confirmation email
              shortly.
            </p>
          </div>

          <div class="error-message">
            <strong>Payment Failed!</strong>
            <p id="error-text"></p>
          </div>

          <button type="submit" id="submit-button" class="payment-button">
            Pay Now
          </button>
        </form>
      </div>
    </div>

    <script>
      // Initialize Stripe
      const stripe = Stripe(
        "pk_test_51QfQyYCQkunRa8JYtiDumB6BMWjOwqrYMnp3p14rxHepDcSWALJKrKGp4immlWPAbejkuzGgoJbsIApu8WEbgv0Z00NwDBA5XT"
      );
      const elements = stripe.elements();

      // Create card element
      const cardElement = elements.create("card", {
        style: {
          base: {
            fontSize: "16px",
            color: "#424770",
            "::placeholder": {
              color: "#aab7c4",
            },
          },
        },
      });

      cardElement.mount("#card-element");

      // Handle card errors
      cardElement.on("change", ({ error }) => {
        const displayError = document.getElementById("card-errors");
        if (error) {
          displayError.textContent = error.message;
        } else {
          displayError.textContent = "";
        }
      });

      // Sample products data (replace with actual API call)
      const sampleProducts = [
        {
          _id: "1",
          name: "Premium Wireless Headphones",
          description:
            "High-quality wireless headphones with noise cancellation and 30-hour battery life.",
          price: 199.99,
          currency: "usd",
          image:
            "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300&h=200&fit=crop",
          category: "Electronics",
          stock: 15,
        },
        {
          _id: "2",
          name: "Smart Fitness Watch",
          description:
            "Track your fitness goals with this advanced smartwatch featuring heart rate monitoring.",
          price: 299.99,
          currency: "usd",
          image:
            "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300&h=200&fit=crop",
          category: "Wearables",
          stock: 8,
        },
        {
          _id: "3",
          name: "Portable Bluetooth Speaker",
          description:
            "Waterproof portable speaker with 360-degree sound and 12-hour battery.",
          price: 79.99,
          currency: "usd",
          image:
            "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=300&h=200&fit=crop",
          category: "Audio",
          stock: 25,
        },
      ];

      let currentProduct = null;

      // Load products
      function loadProducts() {
        const productsGrid = document.getElementById("products-grid");
        productsGrid.innerHTML = "";

        sampleProducts.forEach((product) => {
          const productCard = document.createElement("div");
          productCard.className = "product-card";
          productCard.innerHTML = `
                    <img src="${product.image}" alt="${
            product.name
          }" class="product-image">
                    <div class="product-name">${product.name}</div>
                    <div class="product-description">${
                      product.description
                    }</div>
                    <div class="product-price">$${product.price.toFixed(
                      2
                    )}</div>
                    <div class="product-stock">Stock: ${
                      product.stock
                    } available</div>
                    <div class="quantity-selector">
                        <label>Quantity:</label>
                        <input type="number" min="1" max="${
                          product.stock
                        }" value="1" id="qty-${product._id}">
                    </div>
                    <button class="pay-button" onclick="openPaymentModal('${
                      product._id
                    }')" ${product.stock === 0 ? "disabled" : ""}>
                        ${product.stock === 0 ? "Out of Stock" : "Pay Now"}
                    </button>
                `;
          productsGrid.appendChild(productCard);
        });
      }

      // Open payment modal
      function openPaymentModal(productId) {
        currentProduct = sampleProducts.find((p) => p._id === productId);
        const quantity = parseInt(
          document.getElementById(`qty-${productId}`).value
        );
        const total = currentProduct.price * quantity;

        // Update order summary
        document.getElementById("orderProductName").textContent =
          currentProduct.name;
        document.getElementById(
          "orderProductPrice"
        ).textContent = `$${currentProduct.price.toFixed(2)}`;
        document.getElementById("orderQuantity").textContent = quantity;
        document.getElementById("orderTotal").textContent = `$${total.toFixed(
          2
        )}`;

        // Show modal
        document.getElementById("paymentModal").style.display = "block";

        // Reset form
        document.getElementById("payment-form").reset();
        document.querySelector(".success-message").style.display = "none";
        document.querySelector(".error-message").style.display = "none";
        document.querySelector(".loading").style.display = "none";
        document.getElementById("submit-button").disabled = false;
      }

      // Close modal
      document.querySelector(".close").onclick = function () {
        document.getElementById("paymentModal").style.display = "none";
      };

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("paymentModal");
        if (event.target == modal) {
          modal.style.display = "none";
        }
      };

      // Handle payment form submission
      document
        .getElementById("payment-form")
        .addEventListener("submit", async (event) => {
          event.preventDefault();

          const submitButton = document.getElementById("submit-button");
          const loading = document.querySelector(".loading");
          const successMessage = document.querySelector(".success-message");
          const errorMessage = document.querySelector(".error-message");

          // Show loading
          submitButton.disabled = true;
          loading.style.display = "block";
          successMessage.style.display = "none";
          errorMessage.style.display = "none";

          const email = document.getElementById("email").value;
          const quantity = parseInt(
            document.getElementById("orderQuantity").textContent
          );

          try {
            // Create payment intent
            const response = await fetch(
              "http://localhost:7000/Stripe/create-payment-intent",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  productId: currentProduct._id,
                  quantity: quantity,
                  customerEmail: email,
                }),
              }
            );

            console.log(response);
            const { clientSecret, paymentIntentId } = await response.json();

            if (!clientSecret) {
              throw new Error("Failed to create payment intent");
            }

            // Confirm payment
            const { error, paymentIntent } = await stripe.confirmCardPayment(
              clientSecret,
              {
                payment_method: {
                  card: cardElement,
                  billing_details: {
                    email: email,
                  },
                },
              }
            );

            if (error) {
              throw error;
            } else {
              // Payment succeeded
              await fetch("http://localhost:7000/Stripe/confirm-payment", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  paymentIntentId: paymentIntent.id,
                }),
              });

              // Show success message
              loading.style.display = "none";
              successMessage.style.display = "block";

              // Update product stock in UI
              const productIndex = sampleProducts.findIndex(
                (p) => p._id === currentProduct._id
              );
              if (productIndex > -1) {
                sampleProducts[productIndex].stock -= quantity;
                loadProducts(); // Reload products to update stock display
              }

              // Close modal after 3 seconds
              setTimeout(() => {
                document.getElementById("paymentModal").style.display = "none";
              }, 3000);
            }
          } catch (error) {
            console.error("Payment error:", error);
            loading.style.display = "none";
            errorMessage.style.display = "block";
            document.getElementById("error-text").textContent =
              error.message || "An unexpected error occurred";
            submitButton.disabled = false;
          }
        });

      // Load products on page load
      loadProducts();
    </script>
  </body>
</html>
